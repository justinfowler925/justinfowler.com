name: Public surface guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Hosted runners on this personal account are billing-locked, so the guard never
    # ran; the repo-registered self-hosted runner (see justinfowler925/shine) runs it.
    runs-on: [self-hosted, macOS, ARM64, portfolio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-public-work.mjs --check
      - run: node scripts/validate-public-surface.mjs
      - run: node tests/hollywood-developer-review.test.mjs
      - run: npm ci
      - run: npm run test:feedback
